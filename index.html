<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#2a1a4a; --bg2:#3a2766; --box:#1b2b8f; --box2:#0e1a5c; --ink:#fff; --gold:#ffd84a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#140c28; --bg2:#22163f; } }
:root[data-theme="dark"]{ --bg:#140c28; --bg2:#22163f; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  display:flex; flex-direction:column; align-items:center; overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
#stage{position:relative; width:min(100%, 880px); margin-top:8px}
canvas{display:block; width:100%; aspect-ratio:480/270; background:#000; border-top:4px solid var(--bg2); border-bottom:4px solid var(--bg2)}
#mute{position:absolute; right:6px; bottom:10px; font:inherit; font-size:8px; background:rgba(12,8,34,.75); color:#fff; border:2px solid rgba(255,255,255,.5); border-radius:6px; padding:6px 8px; cursor:pointer}
.ov{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(8,4,20,.72); padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px); overflow:auto}
.ov[hidden]{display:none}
.box{width:100%; max-width:480px; max-height:100%; overflow:auto; -webkit-overflow-scrolling:touch; background:linear-gradient(180deg,var(--box),var(--box2)); border:4px solid #fff; border-radius:10px; box-shadow:0 0 0 3px #000; padding:14px}
.box h2{margin:0 0 10px; font-size:13px; color:var(--gold); line-height:1.5}
.box p{margin:0 0 12px; font-size:9px; line-height:1.9}
.box ul{margin:0 0 12px; padding:0; list-style:none; font-size:9px; line-height:2.1}
.box.title{background:#1f2429; border-color:#ffd24a; text-align:center}
.box.title .logo{display:block; width:min(62%,260px,34vh); aspect-ratio:1; margin:0 auto 12px}
.box.title p{text-align:left}
.box.title p.credit{text-align:center; color:var(--gold); font-size:9px; margin:-2px 0 14px; letter-spacing:.5px}
.credit-end{text-align:center; opacity:.8; font-size:8px}
.btns{display:flex; flex-direction:column; gap:8px}
.btns button{font:inherit; font-size:11px; padding:12px; color:#1b1340; background:var(--gold); border:3px solid #fff; border-radius:6px; cursor:pointer}
.btns button:focus-visible{outline:2px solid #fff; outline-offset:3px}
.btns a.gear{font:inherit; font-size:10px; padding:10px; text-align:center; text-decoration:none; color:var(--gold); background:transparent; border:3px solid var(--gold); border-radius:6px; cursor:pointer}
.btns a.gear:hover,.btns a.gear:focus-visible{background:var(--gold); color:#1b1340; outline:none}
.btns a.pint{font:inherit; font-size:10px; padding:10px; text-align:center; text-decoration:none; color:#1b1340; background:#ffb84a; border:3px solid #1b1340; box-shadow:0 0 0 2px #ffb84a; border-radius:6px; cursor:pointer}
.btns a.pint:hover,.btns a.pint:focus-visible{background:#ffd84a; outline:none}
.btns a.gear{font-size:8px; opacity:.85}
.pick-h{text-align:center!important; color:var(--gold); margin:2px 0 8px!important}
.pick{display:flex; gap:12px; justify-content:center; margin:0 0 14px}
.ch{font:inherit; font-size:9px; color:#fff; background:rgba(255,255,255,.06); border:3px solid rgba(255,255,255,.25); border-radius:10px; padding:6px 10px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px}
.ch canvas{width:64px; height:84px}
.ch.on{border-color:var(--gold); background:rgba(255,216,74,.16); color:var(--gold)}
.ch:focus-visible{outline:2px solid #fff; outline-offset:3px}
.box img.card{display:block; width:100%; max-width:320px; margin:0 auto 12px; border-radius:8px; border:3px solid var(--gold)}
#pad{width:min(100%,880px); display:flex; justify-content:space-between; align-items:center; padding:16px 16px 22px; gap:12px}
.grp{display:flex; gap:12px; align-items:center}
.pb{font:inherit; width:76px; height:76px; border-radius:50%; border:3px solid rgba(255,255,255,.35); background:var(--bg2); color:#fff; font-size:18px; touch-action:none; display:flex; align-items:center; justify-content:center; cursor:pointer}
.pb.on{background:#fff; color:#1b1340}
.pb.a{background:var(--gold); color:#1b1340; border-color:#fff; font-size:9px}
.pb.b{background:#e8423a; border-color:#fff; font-size:9px; transform:translateY(20px)}
.pb.b.talk{background:#3fcf6a; color:#0d2a14}
.pb.a.on{filter:brightness(1.25); transform:scale(.94)}
.pb.b.on{filter:brightness(1.25); transform:translateY(20px) scale(.94)}
#hint{font-size:8px; opacity:.65; padding:12px; text-align:center; line-height:1.9; display:none}
@media (hover:hover) and (pointer:fine){ #pad{display:none} #hint{display:block} }
#rotate{display:none; font-size:8px; opacity:.7; padding:10px 12px 0; text-align:center; line-height:1.8}
@media (orientation:portrait) and (hover:none){ #rotate{display:block} }
@media (orientation:landscape) and (max-height:520px){
  #stage{width:min(100%, calc((100dvh - 8px) * 480 / 270)); margin-top:0}
  canvas{border-width:0}
  #pad{position:fixed; left:0; right:0; bottom:0; padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 14px); pointer-events:none; z-index:10}
  #pad .pb{pointer-events:auto; opacity:.72; width:62px; height:62px}
  #mute{bottom:auto; top:32px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540" aria-label="Dodgy Dublin Redemption game screen"></canvas>
  <button id="mute" aria-label="Toggle sound">SOUND ON</button>
  <div class="ov" id="ov"><div class="box" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt"></h2><div id="dx"></div><div class="btns" id="db"></div></div></div>
</div>
<div id="pad">
  <div class="grp"><button class="pb" data-k="l" aria-label="Left">◀</button><button class="pb" data-k="r" aria-label="Right">▶</button></div>
  <div class="grp"><button class="pb b" data-k="p" id="actBtn">PUNCH</button><button class="pb a" data-k="j">JUMP</button></div>
</div>
<div id="rotate">Tip: turn your phone sideways for a bigger screen</div>
<div id="hint">← → or A D to walk &nbsp; Space / W / ↑ to jump &nbsp; J or X to punch or talk &nbsp; M for sound</div>

<script>
(function(){
const cv=document.getElementById('game'); let ctx=cv.getContext('2d');
const VW=480, VH=270, GROUND=222, GRAV=1500, END=7520, ARENA=6880;
const S1_BRIDGES=[{x0:2440,x1:2960,h:44,k:'hap'}];
let BRIDGES=S1_BRIDGES, BRIDGE=S1_BRIDGES[0], STAGE=1;
const OUT='#1c1424';
const LOGO='./icons/logo.png';
const FONTF="'Press Start 2P', ui-monospace, monospace";
const S1_SECTIONS=[
 {x:0,name:'CAPEL ST'},{x:1200,name:"O'CONNELL ST"},{x:2300,name:"HA'PENNY BRIDGE"},{x:3100,name:'TEMPLE BAR'},
 {x:4000,name:'DAME ST'},{x:4900,name:'DRURY ST'},{x:5700,name:'GRAFTON ST'},{x:6700,name:"ST STEPHEN'S GREEN"}];
const S1_CROSSINGS=[{x:1250,w:84},{x:4700,w:84}];
const S1_GAPS=[{x:4500,w:60}];
const S1_BACK=[
 ['georgian',0,180],['shop',180,150,'NEWSAGENT'],['georgian',330,270],['bambino',600,180],['georgian',780,200],['shop',980,220,'CHIPPER'],
 ['georgian',1200,180],['gpo',1380,300],['georgian',1680,160],['shop',1840,200,'BOOKIES'],['georgian',2040,260],
 ['quay',2300,660],['merchants',2960,160],
 ['georgian',3120,160],['templebar',3280,240],['shop',3520,180,'SPORTS BAR'],['georgian',3700,300],
 ['cityhall',4000,300],['civic',4300,340],['georgian',4640,260],
 ['georgian',4900,200],['ciss',5100,220],['shop',5320,180,'VINTAGE'],['georgian',5500,200],
 ['georgian',5700,120],['bewleys',5820,220],['shop',6040,180,'BOOKSHOP'],['georgian',6220,480],
 ['green',6700,820]];
let SECTIONS=S1_SECTIONS, CROSSINGS=S1_CROSSINGS, GAPS=S1_GAPS, BACK=S1_BACK;
function sectionAt(x){let s=SECTIONS[0];for(const q of SECTIONS) if(x>=q.x) s=q; return s;}
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
function groundAt(x){ for(const b of BRIDGES){ if(x>b.x0&&x<b.x1){const t=(x-b.x0)/(b.x1-b.x0);return GROUND-b.h*Math.sin(Math.PI*t);} } return GROUND; }
function overGap(x){for(const g of GAPS) if(x>g.x+4&&x<g.x+g.w-4) return g; return null;}
function crossingAt(x){for(const c of CROSSINGS) if(x>=c.x&&x<c.x+c.w) return c; return null;}

/* ---------------- AUDIO ---------------- */
const AU={c:null,on:true,m:null,siren:null,sirenG:null};
function auInit(){ if(AU.c){ if(AU.c.state==='suspended') AU.c.resume(); musInit(); return; } try{ AU.c=new (window.AudioContext||window.webkitAudioContext)(); AU.m=AU.c.createGain(); AU.m.gain.value=AU.on?0.35:0; AU.m.connect(AU.c.destination); musInit();}catch(e){AU.c=null;} }
function tone(f,d,type,vol,slide,when){ if(!AU.c||!AU.on) return; const t=AU.c.currentTime+(when||0); const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d); o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+d+.03); }
const sfx={
 coin(){tone(988,.05,'square',.14);tone(1319,.1,'square',.14,0,.05);},
 jump(){tone(260,.14,'square',.1,260);},
 stomp(){tone(220,.14,'square',.22,-150);},
 hurt(){tone(420,.32,'sawtooth',.2,-320);},
 punch(){tone(130,.07,'triangle',.35,-40);},
 tick(){tone(2400,.01,'square',.16);},
 tock(){tone(880,.035,'square',.14);},
 ding(){tone(1568,.45,'sine',.3);tone(1568,.45,'sine',.3,0,.3);},
 item(){tone(660,.07,'triangle',.25);tone(880,.07,'triangle',.25,0,.07);tone(1175,.12,'triangle',.25,0,.14);},
 talk(){tone(540,.05,'square',.1);tone(680,.06,'square',.1,0,.06);},
 kick(){tone(110,.12,'sine',.45,-60);},
 hat(){tone(7000,.02,'square',.04);},
 horn(){tone(330,.25,'sawtooth',.12);tone(415,.25,'sawtooth',.1);},
 bell(){tone(2637,.1,'sine',.16);tone(2637,.12,'sine',.16,0,.15);},
};
function sirenSet(vol,t){
  if(!AU.c||!AU.on||vol<=0.001){ if(AU.siren){ try{AU.siren.stop();}catch(e){} AU.siren=null; } return; }
  if(!AU.siren){ AU.siren=AU.c.createOscillator(); AU.siren.type='triangle'; AU.sirenG=AU.c.createGain(); AU.sirenG.gain.value=0; AU.siren.connect(AU.sirenG); AU.sirenG.connect(AU.m); AU.siren.start(); }
  AU.siren.frequency.setTargetAtTime(Math.floor(t*2.4)%2?960:720, AU.c.currentTime, .02);
  AU.sirenG.gain.setTargetAtTime(vol*.16, AU.c.currentTime, .05);
}

/* ---------------- VOICES (speech bubbles talk out loud) ---------------- */
const VOICE={ok:typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',m:null,f:null,any:null,clips:new Set(),audio:null};
const FEM=/female|moira|emily|orla|niamh|sonia|libby|maisie|serena|kate|fiona|karen|samantha|victoria|hazel|susan|martha|tessa|zira|aria|jenny|catherine|natasha|clara|abbi|bella|hollie|olivia|amy|emma|ava|allison|nicky|zoe|siobhan/i;
const MAL=/\bmale\b|connor|daniel|ryan|thomas|george|oliver|arthur|rishi|fred|alex|aaron|reed|rocko|david|mark|guy|james|brian|noah|alfie|elliot|ethan|harry|jack|lewis|william|liam|nathan|evan|sean|conor/i;
function vScore(v){ const l=(v.lang||'').replace('_','-'); let s;
  if(/^en-IE/i.test(l)) s=100; else if(/^en-GB/i.test(l)) s=40; else if(/^en-(AU|NZ)/i.test(l)) s=20; else if(/^en/i.test(l)) s=10; else return -1;
  if(/natural|neural|enhanced|premium|online/i.test(v.name)) s+=30; if(/google/i.test(v.name)) s+=4; return s; }
function pickVoice(){ if(!VOICE.ok) return; const vs=speechSynthesis.getVoices().filter(v=>vScore(v)>=0); if(!vs.length) return;
  const best=list=>list.sort((a,b)=>vScore(b)-vScore(a))[0]||null;
  VOICE.f=best(vs.filter(v=>FEM.test(v.name))); VOICE.m=best(vs.filter(v=>!FEM.test(v.name)&&MAL.test(v.name))); VOICE.any=best(vs.slice()); }
if(VOICE.ok){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
fetch('./voices/clips.json').then(r=>r.ok?r.json():[]).then(a=>{ for(const k of a) VOICE.clips.add(k); }).catch(()=>{});
function voiceUnlock(){ if(!VOICE.ok) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
// who -> [gender, pitch, rate]. Kept close to 1: big pitch shifts are what made it sound robotic.
const VP={homeless:['m',.94,.95],tourist:['f',1.06,1],mate:['m',1,1.02],busker:['m',.96,1],students:['f',1.05,1.04],bambino:['m',1,1],pint:['m',.98,1],bewleys:['f',1.02,1],cans:['m',1,1.02],queue:['f',1.05,1.05],scum:['m',.9,1.04],thief:['m',.88,1.04],garda:['m',.9,.94],dancers:['f',1.08,1.05],crew:['m',1,1.02],sup:['m',1,1],atlas:['f',1.08,1.02],locks:['m',.95,.95],gelato:['m',1.02,1],tourist2:['f',1.05,1],swan:['f',.85,1.1]};
function clipKey(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function speak(text,who,force){
  if(!AU.on||!text) return;
  let t=text.replace(/[♪♥*]/g,'').replace(/€(\d+)/g,'$1 euro').replace(/Pražský/g,'Prashkee').trim(); if(!t) return;
  if(t===t.toUpperCase()) t=t.charAt(0)+t.slice(1).toLowerCase();
  const key=(who==='player'?CHAR+'-':'')+clipKey(t);
  if(VOICE.clips.has(key)){ try{ if(VOICE.audio&&!VOICE.audio.ended&&!VOICE.audio.paused){ if(!force) return; VOICE.audio.pause(); } if(VOICE.ok) speechSynthesis.cancel(); const a=new Audio('./voices/'+key+'.mp3'); a.volume=0.95; a.play().catch(()=>{}); VOICE.audio=a; return; }catch(e){} }
  if(!VOICE.ok) return;
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){ if(!force) return; speechSynthesis.cancel(); }
    const pr=who==='player'?[CHARS[CHAR].g,1,1.02]:(VP[who]||['m',1,1]);
    const g=pr[0], v=(g==='f'?VOICE.f:VOICE.m)||VOICE.any;
    const u=new SpeechSynthesisUtterance(t); if(v){u.voice=v;u.lang=v.lang;} else u.lang='en-IE';
    let pitch=pr[1]; if(v && v===VOICE.any && !(g==='f'?FEM:MAL).test(v.name)) pitch*=g==='f'?1.12:0.86;
    u.pitch=pitch; u.rate=pr[2]; u.volume=0.95; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- MUSIC (soft trad + zone tracks) ---------------- */
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nf(s){const m=s.match(/^([A-G]#?)(\d)$/); return 440*Math.pow(2,(NOTE[m[1]]+12*(+m[2]+1)-69)/12);}
const MUSVOL=0.55;
const MUS={g:null,track:null,want:null,step:0,next:0,noise:null,fade:0};
function musInit(){ if(!AU.c||MUS.g) return; MUS.g=AU.c.createGain(); MUS.g.gain.value=0; MUS.g.connect(AU.m); const len=Math.floor(AU.c.sampleRate*0.3), b=AU.c.createBuffer(1,len,AU.c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; MUS.noise=b; }
function mtone(f,t,d,type,vol,att){ const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+d+0.05); return o; }
function whistle(f,t,d){ const o=mtone(f,t,d,'sine',0.12,0.03); const lfo=AU.c.createOscillator(), lg=AU.c.createGain(); lfo.frequency.value=5.5; lg.gain.value=f*0.006; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t+0.08); lfo.stop(t+d+0.05); mtone(f*2,t,d*0.8,'sine',0.02,0.03); }
function pluck(f,t,vol){ mtone(f,t,0.5,'triangle',vol||0.05,0.005); }
function thump(t,vol){ const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(50,t+0.15); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2); o.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+0.25); }
function noiseHit(t,vol,dur,hp){ const s=AU.c.createBufferSource(); s.buffer=MUS.noise; const f=AU.c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=AU.c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(MUS.g); s.start(t); s.stop(t+dur+0.02); }
function lowNote(f,t,d,vol){ const o=AU.c.createOscillator(), g=AU.c.createGain(), fl=AU.c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.value=500; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(fl); fl.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+d+0.05); }
function strum(notes,t,down,vol){ (down?notes:[...notes].reverse()).forEach((n,i)=>{ const tt=t+i*0.013, o=AU.c.createOscillator(), g=AU.c.createGain(), fl=AU.c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=nf(n); fl.type='lowpass'; fl.frequency.value=1600; g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(vol,tt+0.005); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.45); o.connect(fl); fl.connect(g); g.connect(MUS.g); o.start(tt); o.stop(tt+0.5); }); }
const JIG_A='F#5 A5 A5 B5 A5 F#5 | G5 E5 E5 E5 F#5 G5 | F#5 A5 A5 B5 A5 F#5 | E5 F#5 E5 D5 - - | F#5 A5 A5 D6 A5 F#5 | G5 B5 B5 A5 G5 F#5 | E5 F#5 G5 A5 F#5 D5 | E5 D5 C#5 D5 - -';
const JIG_B='A5 D6 D6 C#6 D6 E6 | F#6 E6 D6 C#6 A5 A5 | B5 G5 G5 A5 F#5 F#5 | G5 E5 E5 E5 F#5 A5 | A5 D6 D6 C#6 D6 E6 | F#6 E6 D6 E6 C#6 A5 | B5 A5 G5 F#5 E5 F#5 | D5 - - D5 - -';
const JIG=[JIG_A,JIG_A,JIG_B,JIG_B].join(' | ').split('|').map(b=>b.trim().split(/\s+/));
const JCA=['D','Em','D','A','D','G','A','D'], JCB=['D','D','G','Em','D','D','G','D'];
const JIG_CH=[...JCA,...JCA,...JCB,...JCB];
const CH={D:['D3','A3','D4','F#4'],Em:['E3','B3','E4','G4'],G:['G2','D3','G3','B3'],A:['A2','E3','A3','C#4'],
  sG:['G2','B2','D3','G3','B3','D4'],sD:['D3','A3','D4','F#4'],sEm:['E2','B2','E3','G3','B3','E4'],sC:['C3','E3','G3','C4','E4'],
  Am:'A1',F:'F1',C:'C2',Gb:'G1'};
const PUB=['sG','sD','sEm','sC'], PUBPAT=[1,0,1,2,0,2,1,2];
const BOOM=['Am','F','C','Gb'], BOOMBASS=[1,0,2,1,1,0,2,0];
function playStep(tr,s,t){
  if(tr==='trad'||tr==='boss'){
    const E=tr==='boss'?0.14:0.2, n=JIG.length*6, st=s%n, bar=Math.floor(st/6), pos=st%6, note=JIG[bar][pos];
    if(note!=='-'){ let h=0; for(let k=pos+1;k<6&&JIG[bar][k]==='-';k++) h++; whistle(nf(note),t,E*(1+h)*0.95); }
    if(pos===0||pos===3){ const ch=CH[JIG_CH[bar]]; pluck(nf(ch[0]),t,0.055); ch.slice(1).forEach((q,i)=>pluck(nf(q),t+0.012*(i+1),0.024)); thump(t,pos===0?0.1:0.05); }
    return E;
  }
  if(tr==='tb'){
    const E=0.15, st=s%32, bar=Math.floor(st/8), pos=st%8, ch=CH[PUB[bar]], p=PUBPAT[pos];
    if(p) strum(ch,t,p===1,p===1?0.022:0.014);
    if(pos===0||pos===4){ lowNote(nf(ch[0]),t,0.5,0.09); thump(t,0.07); }
    if(pos===2||pos===6) noiseHit(t,0.03,0.08,1800);
    return E;
  }
  if(tr==='ciss'){
    const E=0.15, st=s%32, bar=Math.floor(st/8), pos=st%8, root=nf(CH[BOOM[bar]]+'');
    if(pos===0||pos===4||pos===5) thump(t,0.16);
    if(pos===2||pos===6) noiseHit(t,0.06,0.12,1200);
    noiseHit(t+0.0,0.015,0.03,7000);
    const b=BOOMBASS[pos]; if(b) lowNote(root*(b===2?2:1),t,0.14,0.12);
    return E;
  }
  return 0.2;
}
function musTick(){
  if(!AU.c||!AU.on||!MUS.g) return;
  const now=AU.c.currentTime;
  const want=stageMusic();
  if(!MUS.track){ MUS.track=MUS.want=want; MUS.step=0; MUS.next=now+0.05; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(0,now); MUS.g.gain.linearRampToValueAtTime(MUSVOL,now+1.2); }
  else if(want!==MUS.want){ MUS.want=want; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(MUS.g.gain.value,now); MUS.g.gain.linearRampToValueAtTime(0,now+0.4); MUS.fade=now+0.4; }
  if(MUS.fade){ if(now<MUS.fade) return; MUS.fade=0; MUS.track=MUS.want; MUS.step=0; MUS.next=now+0.05; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(0,now); MUS.g.gain.linearRampToValueAtTime(MUSVOL,now+0.9); }
  if(MUS.next<now) MUS.next=now+0.05;
  while(MUS.next<now+0.3){ MUS.next+=playStep(MUS.track,MUS.step,MUS.next); MUS.step++; }
}

function build(fromX){
  plats=[];coins=[];rolls=[];items=[];enemies=[];npcs=[];trigs=[];pops=[];boss=null;luas=null;S.perched=true;
  boats=[];waves=[];jbl=null;luasOv=null;swanEv=null;
  xings=CROSSINGS.map(c=>({...c,phase:'red',t:2+Math.random()*2,cars:[],spawn:0.6,snd:0}));
  for(const d of levelDef()){
    if(d.t==='plat'){plats.push({...d});continue;}
    if(d.t==='queue'){ npcs.push({k:'queue',x:d.x,c:d.c,sayT:0}); plats.push({k:'head',x:d.x-7,w:14,h:0,y:GROUND-47,q:npcs[npcs.length-1]}); continue; }
    if(d.t==='goal'){goalX=d.x;continue;}
    if(d.t==='perch'){ if(d.x<fromX) S.perched=false; else trigs.push({t:'perch',x:d.x}); continue; }
    if(d.t==='boat'){ boats.push({k:d.k,x:d.x,x0:d.x,vx:d.vx,r:d.r}); continue; }
    if(d.t==='luasover'){ luasOv={t:0.5,tram:null,seen:d.x<fromX}; continue; }
    if(d.t==='jbl'){ jbl={x:d.x,t:1}; continue; }
    if(d.t==='swans'){ if(!S.swans&&d.x>fromX-60) swanEv={x0:d.x,state:'wait',birds:[{x:d.x,k:'swan',ph:0},{x:d.x-24,k:'cyg',ph:1},{x:d.x-42,k:'cyg',ph:2}],say:'',sayT:0}; continue; }
    if(d.x<fromX+40) continue;
    switch(d.t){
      case 'coin': coins.push({x:d.x,y:d.y}); break;
      case 'roll': rolls.push({x:d.x,y:d.y}); break;
      case 'item': items.push({k:d.k,x:d.x,y:d.y}); break;
      case 'scum': enemies.push({type:'scum',x:d.x,y:GROUND,hp:2,state:'idle',t:0,vx:0,face:-1,flash:0}); break;
      case 'thief': enemies.push({type:'thief',x:d.x,y:GROUND,hp:2,state:'cut',t:0,vx:0,face:-1,flash:0,rackX:d.x+40,kind:d.kind||'own'}); break;
      case 'gullT': trigs.push({t:'gull',x:d.x}); break;
      case 'scooter': trigs.push({t:'scooter',x:d.x}); break;
      case 'luas': luas={x:d.x,fired:false,warn:0,tram:null}; break;
      case 'npc': npcs.push({k:d.k,x:d.x,x0:d.x,vx:16,used:false,sayT:0,greeted:false}); break;
      case 'cyclist': trigs.push({t:'cyc',x:d.x}); break;
      case 'rain': trigs.push({t:'rain',x:d.x}); break;
      case 'boss': trigs.push({t:'boss',x:d.x}); break;
    }
  }
}

function pBox(){const h=P.bike?50:44;return {l:P.x-8,r:P.x+8,t:P.y-h,b:P.y};}
function ov_(a,b){return a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;}
function hurt(msg,fromX){

function stomped(eb){ return P.vy>0 && P.prevB<=eb.t+10; }

/* ---------------- UPDATE ---------------- */
let lastAct='';
function update(dt){
  const sec=sectionAt(P.x);
  if(sec!==lastSection){ if(lastSection) cp={x:sec.x+30,money:S.money,craic:S.craic,bike:P.bike,bikeKind:P.bikeKind,score:S.score,brolly:S.brolly,swans:S.swans}; lastSection=sec; banner(sec.name); }
  if(bannerT>0) bannerT-=dt; if(shake>0) shake-=dt;
  jumpBuf-=dt; punchBuf-=dt;

  const spd=(P.bike?230:150)*(S.rainT>0&&!S.brolly?0.78:1), jv=P.bike?620:580;
  const dir=(input.r?1:0)-(input.l?1:0);
  P.vx=dir*spd; if(dir) P.face=dir;
  if(P.knock){P.vx+=P.knock; P.knock*=Math.pow(0.01,dt); if(Math.abs(P.knock)<8)P.knock=0;}
  if(jumpBuf>0 && P.onG){P.vy=-jv; P.onG=false; jumpBuf=0; sfx.jump();}
  if(!input.j && P.vy<-230) P.vy=-230;
  P.vy=Math.min(800,P.vy+GRAV*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(camX+12,Math.min(S.lock?camX+VW-12:END,P.x));
  const wasOnG=P.onG; P.prevB=P.y; P.y+=P.vy*dt; P.onG=false; P.stand=null;
  if(P.vy>=0){
    const g=groundAt(P.x);
    if(!overGap(P.x)){
      if(P.y>=g && P.prevB<=g+16){P.y=g;P.vy=0;P.onG=true;}
      else if(wasOnG && P.y<g && g-P.y<9){P.y=g;P.vy=0;P.onG=true;}
    }
    for(const p of plats){ if(P.prevB<=p.y+2 && P.y>=p.y && P.x+7>p.x && P.x-7<p.x+p.w){P.y=p.y;P.vy=0;P.onG=true;P.stand=p;} }
  }
  if(P.stand&&P.stand.k==='head'){ const q=P.stand.q; if(q.sayT<=0){ q.say=['OI!','NO SKIPPING!',"QUEUE'S BACK THERE!",'GET OFF ME HEAD!'][hash(q.x,Math.floor(time))%4]; q.sayT=1.4; speak(q.say,'queue',false); } }
  if(P.y>VH+40){ const g=overGap(P.x)||GAPS[0]; P.inv=0; hurt(STAGE===2?'SPLASH! MIND THE LOCK':'SPLASH! IRISH WATER',P.x); if(state!=='play')return; P.x=g.x-24; P.y=GROUND; P.vy=0; P.knock=0; }
  if(P.vx) P.anim+=dt;
  if(P.inv>0) P.inv-=dt;

  const nt=nearTalk();
  const want=nt?PROMPT[nt.k]:'PUNCH';
  if(want!==lastAct){ lastAct=want; actBtn.textContent=want.split(' ')[0]; actBtn.classList.toggle('talk',!!nt); }
  if(P.cd>0) P.cd-=dt;
  if(punchBuf>0 && P.cd<=0){ punchBuf=0; if(nt){ talk(nt); P.cd=0.4; } else { P.punchT=0.18; P.cd=0.3; punchId++; sfx.punch(); } }
  if(P.punchT>0) P.punchT-=dt;
  const fist=P.punchT>0?{l:P.face>0?P.x+4:P.x-32,r:P.face>0?P.x+32:P.x-4,t:P.y-36,b:P.y-16}:null;

  if(S.lock) camX+=(ARENA-camX)*Math.min(1,dt*4);
  else camX=Math.max(camX,Math.min(P.x-170,END-VW));

  for(let i=trigs.length-1;i>=0;i--){ const t=trigs[i];
    if(t.t==='gull' && camX+VW>=t.x){ enemies.push({type:'gull',x:camX+VW+20,y:46+Math.random()*40,vx:-110,vy:0,state:'enter',f:Math.random()*6}); trigs.splice(i,1); }
    else if(t.t==='perch' && P.x>=t.x){ S.perched=false; const lx=2700, ly=groundAt(2700)-28-92; enemies.push({type:'gull',x:lx,y:ly,vx:0,vy:0,state:'enter',f:0}); pop(lx,ly-24,'SQUAWK!','#fff'); trigs.splice(i,1); }
    else if(t.t==='scooter' && camX+VW>=t.x){ const sc={type:'scooter',x:camX+VW+40,y:GROUND,vx:-290,state:'ride',t:0}; const gd={type:'garda',x:sc.x+190,y:GROUND,vx:-290,state:'chase',t:0,link:sc}; sc.link=gd; enemies.push(sc,gd); banner('GARDA CHASE! JUMP!'); trigs.splice(i,1); }
    else if(t.t==='boss' && P.x>=t.x){ S.lock=true; const hp=STAGE===2?4:3; boss={x:ARENA+300,y:-50,hp,max:hp,state:'enter',t:0,vx:0,vy:0,inv:0,f:0}; banner(STAGE===2?'BIG GULL: THE SEQUEL':'THE BIG GULL'); trigs.splice(i,1); }
    else if(t.t==='cyc' && camX+VW>=t.x){ enemies.push({type:'cyclist',x:camX+VW+40,y:GROUND,vx:-(220+Math.random()*50),state:'ride',ph:0,col:['#e8423a','#ffd84a','#3a8ae0','#2e9e4f','#c83a8a'][Math.floor(Math.random()*5)],say:'BING BING!',sayT:1.6,flash:0}); sfx.bell(); trigs.splice(i,1); }
    else if(t.t==='rain' && P.x>=t.x){ S.rainT=17; banner("OMG IT'S RAINING AGAIN"); speak("Oh my god, it's raining again",'player',true); if(S.brolly) pop(P.x,P.y-70,'BROLLY UP!','#3fcf6a'); else { craic(-1); pop(P.x,P.y-70,'SOAKED! -1 CRAIC','#6bd6ff'); } trigs.splice(i,1); }
  }

  const pb=pBox();
  for(let i=coins.length-1;i>=0;i--){const c=coins[i]; if(Math.abs(c.x-P.x)<14&&c.y>pb.t-8&&c.y<pb.b+6){coins.splice(i,1);S.money+=1;pts(10);sfx.coin();pop(c.x,c.y-10,'+€1','#ffd84a');}}
  for(let i=rolls.length-1;i>=0;i--){const c=rolls[i]; if(Math.abs(c.x-P.x)<16&&c.y>pb.t-10&&c.y<pb.b+6){rolls.splice(i,1);S.rolls=Math.min(5,S.rolls+1);pts(50);sfx.item();pop(c.x,c.y-12,'+1 ROLL','#3fcf6a');}}
  for(let i=items.length-1;i>=0;i--){const it=items[i]; if(Math.abs(it.x-P.x)<16&&it.y>pb.t-10&&it.y<pb.b+6){ items.splice(i,1); sfx.item();
    if(it.k==='bike'){ P.bike=true; P.bikeKind='own'; S.bikeSaved=true; craic(2); pts(300); pop(it.x,it.y-50,'YOUR BIKE! RIDE ON!','#3fcf6a'); continue; }
    if(it.k==='dubbike'){ if(!P.bike){P.bike=true; P.bikeKind='dub';} S.dubBike=true; S.kind++; craic(2); pts(200); pop(it.x,it.y-50,'DUBLIN BIKE! RIDE ON!','#3fcf6a'); continue; }
    const r={tayto:['TAYTO! +50',()=>pts(50)],orange:['CLUB ORANGE! +50',()=>pts(50)],tea:["BARRY'S TEA +1 CRAIC",()=>{pts(30);craic(1);}],leap:['LEAP CARD! +€5',()=>{pts(30);S.money+=5;}],brolly:['BROLLY! +50',()=>{pts(50);S.brolly=true;}]}[it.k];
    r[1](); pop(it.x,it.y-14,r[0],'#ffd84a'); }}
  for(const n of npcs){ if(n.sayT>0)n.sayT-=dt; if(GREET[n.k]&&!n.greeted&&!n.used&&Math.abs(n.x-P.x)<150){ n.greeted=true; n.say=GREET[n.k]; n.sayT=2.6; speak(n.say,n.k,false); } }
  for(const x of xings){
    if(x.hold){ x.phase='green'; x.t=5; }
    x.t-=dt;
    if(x.t<=0){ if(x.phase==='red'){x.phase='green';x.t=4;} else {x.phase='red';x.t=4.4;x.spawn=0.6;} }
    const near=Math.abs(x.x+x.w/2-P.x)<260;
    if(near){ x.snd-=dt; if(x.snd<=0){ if(x.phase==='green'){x.snd=0.075; sfx.tick();} else {x.snd=1.0; sfx.tock();} } }
    if(x.phase==='red'&&x.t>0.8){ x.spawn-=dt; if(x.spawn<=0){ x.spawn=1.1+Math.random()*0.6; if(Math.abs(x.x-camX)<VW+100) x.cars.push({s:0,k:['car','car','bus','taxi','car'][Math.floor(Math.random()*5)],c:['#d8262e','#2a6fd6','#f2f2f2','#3a3a3a','#2e9e4f','#e0a020'][Math.floor(Math.random()*6)]}); if(near&&Math.random()<.3) sfx.horn(); } }
    for(let i=x.cars.length-1;i>=0;i--){ const c=x.cars[i]; c.s+=dt/0.95; if(c.s>1.25){x.cars.splice(i,1);continue;}
      if(c.s>0.62&&c.s<0.9 && P.x>x.x+6 && P.x<x.x+x.w-6 && P.y>GROUND-34){ hurt(c.k==='bus'?'DUBLIN BUS!':'WAIT FOR THE GREEN MAN!',P.x+30); P.x=x.x-6; } }
  }
  if(luas){

    if(luas.tram){ luas.tram.x-=400*dt; const tb={l:luas.tram.x,r:luas.tram.x+luas.tram.w,t:GROUND-60,b:GROUND};

function updEnemy(e,dt,pb,fist){
  if(e.flash>0) e.flash-=dt;
  if(e.type==='cyclist'){
    e.x+=e.vx*dt; e.y=groundAt(e.x); e.ph+=dt*14; if(e.sayT>0) e.sayT-=dt;
    if(e.state==='ride'){ const eb={l:e.x-16,r:e.x+16,t:e.y-52,b:e.y};
      if(ov_(pb,eb)){ if(stomped(eb)){ bounce(); e.state='pass'; pop(e.x,e.y-70,'SORRY!','#fff'); } else if(P.inv<=0){ hurt('ON YER LEFT!',e.x); e.state='pass'; } }
      else if(!e.dodged && e.x<P.x-24){ e.dodged=true; S.dodges++; pts(50); pop(P.x,P.y-64,'DODGED! +50','#ffd84a'); } }
    return e.x<camX-90;
  }
  if(e.type==='gull'){
    e.f+=dt*12;
    if(e.state==='enter'){ e.x+=e.vx*dt; e.y+=Math.sin(time*5+e.f)*0.4; if(e.x-P.x<130 && e.x>camX+30){ e.state='dive'; const dx=P.x-e.x, dy=(P.y-26)-e.y, d=Math.hypot(dx,dy)||1; e.vx=dx/d*270; e.vy=dy/d*270; } if(e.x<camX-40) return true; }
    else if(e.state==='dive'){ e.x+=e.vx*dt; e.y+=e.vy*dt; if(e.y>=groundAt(e.x)-18){ e.state='rise'; e.vx=-190; e.vy=-150; } if(e.x<camX-50||e.y<-50) return true; }
    else if(e.state==='rise'||e.state==='flee'){ e.x+=e.vx*dt; e.y+=e.vy*dt; if(e.y<-40||e.x<camX-50) return true; }
    else if(e.state==='dead'){ e.vy+=GRAV*dt; e.y+=e.vy*dt; e.x+=40*dt; return e.y>VH+30; }
    if(e.state==='dead'||e.state==='flee') return false;
