<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dodgy Dublin Redemption by Matheus Amud: a retro side-scroller through Dublin city centre. Stomp seagulls, dodge the Luas, save your bike.">
<meta name="author" content="Matheus Amud">
<meta name="theme-color" content="#1f2428">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dodgy Dublin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Dodgy Dublin Redemption">
<meta property="og:description" content="Stomp seagulls, dodge the Luas, save your bike. A game by Matheus Amud.">
<meta property="og:image" content="./icons/icon-512.png">
<title>Dodgy Dublin Redemption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1a4a; --bg2:#3a2766; --box:#1b2b8f; --box2:#0e1a5c; --ink:#fff; --gold:#ffd84a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#140c28; --bg2:#22163f; } }
:root[data-theme="dark"]{ --bg:#140c28; --bg2:#22163f; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  display:flex; flex-direction:column; align-items:center; overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
#stage{position:relative; width:min(100%, 880px); margin-top:8px}
canvas{display:block; width:100%; aspect-ratio:480/270; background:#000; border-top:4px solid var(--bg2); border-bottom:4px solid var(--bg2)}
#mute{position:absolute; right:6px; bottom:10px; font:inherit; font-size:8px; background:rgba(12,8,34,.75); color:#fff; border:2px solid rgba(255,255,255,.5); border-radius:6px; padding:6px 8px; cursor:pointer}
.ov{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(8,4,20,.72); padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px); overflow:auto}
.ov[hidden]{display:none}
.box{width:100%; max-width:480px; max-height:100%; overflow:auto; -webkit-overflow-scrolling:touch; background:linear-gradient(180deg,var(--box),var(--box2)); border:4px solid #fff; border-radius:10px; box-shadow:0 0 0 3px #000; padding:14px}
.box h2{margin:0 0 10px; font-size:13px; color:var(--gold); line-height:1.5}
.box p{margin:0 0 12px; font-size:9px; line-height:1.9}
.box ul{margin:0 0 12px; padding:0; list-style:none; font-size:9px; line-height:2.1}
.box.title{background:#1f2429; border-color:#ffd24a; text-align:center}
.box.title .logo{display:block; width:min(62%,260px,34vh); aspect-ratio:1; margin:0 auto 12px}
.box.title p{text-align:left}
.box.title p.credit{text-align:center; color:var(--gold); font-size:9px; margin:-2px 0 14px; letter-spacing:.5px}
.credit-end{text-align:center; opacity:.8; font-size:8px}
.btns{display:flex; flex-direction:column; gap:8px}
.btns button{font:inherit; font-size:11px; padding:12px; color:#1b1340; background:var(--gold); border:3px solid #fff; border-radius:6px; cursor:pointer}
.btns button:focus-visible{outline:2px solid #fff; outline-offset:3px}
#pad{width:min(100%,880px); display:flex; justify-content:space-between; align-items:center; padding:16px 16px 22px; gap:12px}
.grp{display:flex; gap:12px; align-items:center}
.pb{font:inherit; width:76px; height:76px; border-radius:50%; border:3px solid rgba(255,255,255,.35); background:var(--bg2); color:#fff; font-size:18px; touch-action:none; display:flex; align-items:center; justify-content:center; cursor:pointer}
.pb.on{background:#fff; color:#1b1340}
.pb.a{background:var(--gold); color:#1b1340; border-color:#fff; font-size:9px}
.pb.b{background:#e8423a; border-color:#fff; font-size:9px; transform:translateY(20px)}
.pb.b.talk{background:#3fcf6a; color:#0d2a14}
.pb.a.on{filter:brightness(1.25); transform:scale(.94)}
.pb.b.on{filter:brightness(1.25); transform:translateY(20px) scale(.94)}
#hint{font-size:8px; opacity:.65; padding:12px; text-align:center; line-height:1.9; display:none}
@media (hover:hover) and (pointer:fine){ #pad{display:none} #hint{display:block} }
#rotate{display:none; font-size:8px; opacity:.7; padding:10px 12px 0; text-align:center; line-height:1.8}
@media (orientation:portrait) and (hover:none){ #rotate{display:block} }
@media (orientation:landscape) and (max-height:520px){
  #stage{width:min(100%, calc((100dvh - 8px) * 480 / 270)); margin-top:0}
  canvas{border-width:0}
  #pad{position:fixed; left:0; right:0; bottom:0; padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 14px); pointer-events:none; z-index:10}
  #pad .pb{pointer-events:auto; opacity:.72; width:62px; height:62px}
  #mute{bottom:auto; top:32px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540" aria-label="Dodgy Dublin Redemption game screen"></canvas>
  <button id="mute" aria-label="Toggle sound">SOUND ON</button>
  <div class="ov" id="ov"><div class="box" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt"></h2><div id="dx"></div><div class="btns" id="db"></div></div></div>
</div>
<div id="pad">
  <div class="grp"><button class="pb" data-k="l" aria-label="Left">◀</button><button class="pb" data-k="r" aria-label="Right">▶</button></div>
  <div class="grp"><button class="pb b" data-k="p" id="actBtn">PUNCH</button><button class="pb a" data-k="j">JUMP</button></div>
</div>
<div id="rotate">Tip: turn your phone sideways for a bigger screen</div>
<div id="hint">← → or A D to walk &nbsp; Space / W / ↑ to jump &nbsp; J or X to punch or talk &nbsp; M for sound</div>

<script>
(function(){
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const VW=480, VH=270, GROUND=222, GRAV=1500, END=7520, ARENA=6880;
const BRIDGE={x0:2440,x1:2960,h:44};
const OUT='#1c1424';
const LOGO='./icons/logo.png';
const FONTF="'Press Start 2P', ui-monospace, monospace";
const SECTIONS=[
 {x:0,name:'CAPEL ST'},{x:1200,name:"O'CONNELL ST"},{x:2300,name:"HA'PENNY BRIDGE"},{x:3100,name:'TEMPLE BAR'},
 {x:4000,name:'DAME ST'},{x:4900,name:'DRURY ST'},{x:5700,name:'GRAFTON ST'},{x:6700,name:"ST STEPHEN'S GREEN"}];
const CROSSINGS=[{x:1250,w:84},{x:4700,w:84}];
const GAPS=[{x:4500,w:60}];
const BACK=[
 ['georgian',0,180],['shop',180,150,'NEWSAGENT'],['georgian',330,270],['bambino',600,180],['georgian',780,200],['shop',980,220,'CHIPPER'],
 ['georgian',1200,180],['gpo',1380,300],['georgian',1680,160],['shop',1840,200,'BOOKIES'],['georgian',2040,260],
 ['quay',2300,660],['merchants',2960,160],
 ['georgian',3120,160],['templebar',3280,240],['shop',3520,180,'SPORTS BAR'],['georgian',3700,300],
 ['cityhall',4000,300],['civic',4300,340],['georgian',4640,260],
 ['georgian',4900,200],['ciss',5100,220],['shop',5320,180,'VINTAGE'],['georgian',5500,200],
 ['georgian',5700,120],['bewleys',5820,220],['shop',6040,180,'BOOKSHOP'],['georgian',6220,480],
 ['green',6700,820]];
function sectionAt(x){let s=SECTIONS[0];for(const q of SECTIONS) if(x>=q.x) s=q; return s;}
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
function groundAt(x){ if(x>BRIDGE.x0&&x<BRIDGE.x1){const t=(x-BRIDGE.x0)/(BRIDGE.x1-BRIDGE.x0);return GROUND-BRIDGE.h*Math.sin(Math.PI*t);} return GROUND; }
function overGap(x){for(const g of GAPS) if(x>g.x+4&&x<g.x+g.w-4) return g; return null;}
function crossingAt(x){for(const c of CROSSINGS) if(x>=c.x&&x<c.x+c.w) return c; return null;}

/* ---------------- AUDIO ---------------- */
const AU={c:null,on:true,m:null,siren:null,sirenG:null};
function auInit(){ if(AU.c){ if(AU.c.state==='suspended') AU.c.resume(); musInit(); return; } try{ AU.c=new (window.AudioContext||window.webkitAudioContext)(); AU.m=AU.c.createGain(); AU.m.gain.value=AU.on?0.35:0; AU.m.connect(AU.c.destination); musInit();}catch(e){AU.c=null;} }
function tone(f,d,type,vol,slide,when){ if(!AU.c||!AU.on) return; const t=AU.c.currentTime+(when||0); const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d); o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+d+.03); }
const sfx={
 coin(){tone(988,.05,'square',.14);tone(1319,.1,'square',.14,0,.05);},
 jump(){tone(260,.14,'square',.1,260);},
 stomp(){tone(220,.14,'square',.22,-150);},
 hurt(){tone(420,.32,'sawtooth',.2,-320);},
 punch(){tone(130,.07,'triangle',.35,-40);},
 tick(){tone(2400,.01,'square',.16);},
 tock(){tone(880,.035,'square',.14);},
 ding(){tone(1568,.45,'sine',.3);tone(1568,.45,'sine',.3,0,.3);},
 item(){tone(660,.07,'triangle',.25);tone(880,.07,'triangle',.25,0,.07);tone(1175,.12,'triangle',.25,0,.14);},
 talk(){tone(540,.05,'square',.1);tone(680,.06,'square',.1,0,.06);},
 kick(){tone(110,.12,'sine',.45,-60);},
 hat(){tone(7000,.02,'square',.04);},
 horn(){tone(330,.25,'sawtooth',.12);tone(415,.25,'sawtooth',.1);},
};
function sirenSet(vol,t){
  if(!AU.c||!AU.on||vol<=0.001){ if(AU.siren){ try{AU.siren.stop();}catch(e){} AU.siren=null; } return; }
  if(!AU.siren){ AU.siren=AU.c.createOscillator(); AU.siren.type='triangle'; AU.sirenG=AU.c.createGain(); AU.sirenG.gain.value=0; AU.siren.connect(AU.sirenG); AU.sirenG.connect(AU.m); AU.siren.start(); }
  AU.siren.frequency.setTargetAtTime(Math.floor(t*2.4)%2?960:720, AU.c.currentTime, .02);
  AU.sirenG.gain.setTargetAtTime(vol*.16, AU.c.currentTime, .05);
}

/* ---------------- VOICES (speech bubbles talk out loud) ---------------- */
const VOICE={ok:typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',v:null};
function pickVoice(){ if(!VOICE.ok) return; const vs=speechSynthesis.getVoices(); VOICE.v=vs.find(v=>/en[-_]IE/i.test(v.lang))||vs.find(v=>/moira/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
if(VOICE.ok){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function voiceUnlock(){ if(!VOICE.ok) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
const VP={homeless:[.8,.95],tourist:[1.35,1.1],mate:[1,1.1],busker:[.9,1],students:[1.25,1.15],bambino:[1.1,1.1],pint:[.95,1],bewleys:[1.2,1],cans:[1.05,1.1],queue:[1.15,1.2],scum:[.7,1.2],thief:[.65,1.15],garda:[.85,1]};
function speak(text,who,force){
  if(!VOICE.ok||!AU.on||!text) return;
  let t=text.replace(/[♪♥*]/g,'').replace(/€(\d+)/g,'$1 euro').replace(/Pražský/g,'Prashkee').trim(); if(!t) return;
  if(t===t.toUpperCase()) t=t.charAt(0)+t.slice(1).toLowerCase();
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){ if(!force) return; speechSynthesis.cancel(); }
    const u=new SpeechSynthesisUtterance(t); if(VOICE.v){u.voice=VOICE.v;u.lang=VOICE.v.lang;} else u.lang='en-IE';
    const pr=VP[who]||[1,1.05]; u.pitch=pr[0]; u.rate=pr[1]; u.volume=0.95; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- MUSIC (soft trad + zone tracks) ---------------- */
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nf(s){const m=s.match(/^([A-G]#?)(\d)$/); return 440*Math.pow(2,(NOTE[m[1]]+12*(+m[2]+1)-69)/12);}
const MUSVOL=0.55;
const MUS={g:null,track:null,want:null,step:0,next:0,noise:null,fade:0};
function musInit(){ if(!AU.c||MUS.g) return; MUS.g=AU.c.createGain(); MUS.g.gain.value=0; MUS.g.connect(AU.m); const len=Math.floor(AU.c.sampleRate*0.3), b=AU.c.createBuffer(1,len,AU.c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; MUS.noise=b; }
function mtone(f,t,d,type,vol,att){ const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+d+0.05); return o; }
function whistle(f,t,d){ const o=mtone(f,t,d,'sine',0.12,0.03); const lfo=AU.c.createOscillator(), lg=AU.c.createGain(); lfo.frequency.value=5.5; lg.gain.value=f*0.006; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t+0.08); lfo.stop(t+d+0.05); mtone(f*2,t,d*0.8,'sine',0.02,0.03); }
function pluck(f,t,vol){ mtone(f,t,0.5,'triangle',vol||0.05,0.005); }
function thump(t,vol){ const o=AU.c.createOscillator(), g=AU.c.createGain(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(50,t+0.15); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2); o.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+0.25); }
function noiseHit(t,vol,dur,hp){ const s=AU.c.createBufferSource(); s.buffer=MUS.noise; const f=AU.c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=AU.c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(MUS.g); s.start(t); s.stop(t+dur+0.02); }
function lowNote(f,t,d,vol){ const o=AU.c.createOscillator(), g=AU.c.createGain(), fl=AU.c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.value=500; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(fl); fl.connect(g); g.connect(MUS.g); o.start(t); o.stop(t+d+0.05); }
function strum(notes,t,down,vol){ (down?notes:[...notes].reverse()).forEach((n,i)=>{ const tt=t+i*0.013, o=AU.c.createOscillator(), g=AU.c.createGain(), fl=AU.c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=nf(n); fl.type='lowpass'; fl.frequency.value=1600; g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(vol,tt+0.005); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.45); o.connect(fl); fl.connect(g); g.connect(MUS.g); o.start(tt); o.stop(tt+0.5); }); }
const JIG_A='F#5 A5 A5 B5 A5 F#5 | G5 E5 E5 E5 F#5 G5 | F#5 A5 A5 B5 A5 F#5 | E5 F#5 E5 D5 - - | F#5 A5 A5 D6 A5 F#5 | G5 B5 B5 A5 G5 F#5 | E5 F#5 G5 A5 F#5 D5 | E5 D5 C#5 D5 - -';
const JIG_B='A5 D6 D6 C#6 D6 E6 | F#6 E6 D6 C#6 A5 A5 | B5 G5 G5 A5 F#5 F#5 | G5 E5 E5 E5 F#5 A5 | A5 D6 D6 C#6 D6 E6 | F#6 E6 D6 E6 C#6 A5 | B5 A5 G5 F#5 E5 F#5 | D5 - - D5 - -';
const JIG=[JIG_A,JIG_A,JIG_B,JIG_B].join(' | ').split('|').map(b=>b.trim().split(/\s+/));
const JCA=['D','Em','D','A','D','G','A','D'], JCB=['D','D','G','Em','D','D','G','D'];
const JIG_CH=[...JCA,...JCA,...JCB,...JCB];
const CH={D:['D3','A3','D4','F#4'],Em:['E3','B3','E4','G4'],G:['G2','D3','G3','B3'],A:['A2','E3','A3','C#4'],
  sG:['G2','B2','D3','G3','B3','D4'],sD:['D3','A3','D4','F#4'],sEm:['E2','B2','E3','G3','B3','E4'],sC:['C3','E3','G3','C4','E4'],
  Am:'A1',F:'F1',C:'C2',Gb:'G1'};
const PUB=['sG','sD','sEm','sC'], PUBPAT=[1,0,1,2,0,2,1,2];
const BOOM=['Am','F','C','Gb'], BOOMBASS=[1,0,2,1,1,0,2,0];
function playStep(tr,s,t){
  if(tr==='trad'||tr==='boss'){
    const E=tr==='boss'?0.14:0.2, n=JIG.length*6, st=s%n, bar=Math.floor(st/6), pos=st%6, note=JIG[bar][pos];
    if(note!=='-'){ let h=0; for(let k=pos+1;k<6&&JIG[bar][k]==='-';k++) h++; whistle(nf(note),t,E*(1+h)*0.95); }
    if(pos===0||pos===3){ const ch=CH[JIG_CH[bar]]; pluck(nf(ch[0]),t,0.055); ch.slice(1).forEach((q,i)=>pluck(nf(q),t+0.012*(i+1),0.024)); thump(t,pos===0?0.1:0.05); }
    return E;
  }
  if(tr==='tb'){
    const E=0.15, st=s%32, bar=Math.floor(st/8), pos=st%8, ch=CH[PUB[bar]], p=PUBPAT[pos];
    if(p) strum(ch,t,p===1,p===1?0.022:0.014);
    if(pos===0||pos===4){ lowNote(nf(ch[0]),t,0.5,0.09); thump(t,0.07); }
    if(pos===2||pos===6) noiseHit(t,0.03,0.08,1800);
    return E;
  }
  if(tr==='ciss'){
    const E=0.15, st=s%32, bar=Math.floor(st/8), pos=st%8, root=nf(CH[BOOM[bar]]+'');
    if(pos===0||pos===4||pos===5) thump(t,0.16);
    if(pos===2||pos===6) noiseHit(t,0.06,0.12,1200);
    noiseHit(t+0.0,0.015,0.03,7000);
    const b=BOOMBASS[pos]; if(b) lowNote(root*(b===2?2:1),t,0.14,0.12);
    return E;
  }
  return 0.2;
}
function musTick(){
  if(!AU.c||!AU.on||!MUS.g) return;
  const now=AU.c.currentTime;
  const want=S.lock?'boss':(P.x>3230&&P.x<3580)?'tb':(P.x>5080&&P.x<5410)?'ciss':'trad';
  if(!MUS.track){ MUS.track=MUS.want=want; MUS.step=0; MUS.next=now+0.05; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(0,now); MUS.g.gain.linearRampToValueAtTime(MUSVOL,now+1.2); }
  else if(want!==MUS.want){ MUS.want=want; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(MUS.g.gain.value,now); MUS.g.gain.linearRampToValueAtTime(0,now+0.4); MUS.fade=now+0.4; }
  if(MUS.fade){ if(now<MUS.fade) return; MUS.fade=0; MUS.track=MUS.want; MUS.step=0; MUS.next=now+0.05; MUS.g.gain.cancelScheduledValues(now); MUS.g.gain.setValueAtTime(0,now); MUS.g.gain.linearRampToValueAtTime(MUSVOL,now+0.9); }
  if(MUS.next<now) MUS.next=now+0.05;
  while(MUS.next<now+0.3){ MUS.next+=playStep(MUS.track,MUS.step,MUS.next); MUS.step++; }
}

const muteBtn=document.getElementById('mute');
function toggleMute(){ AU.on=!AU.on; muteBtn.textContent=AU.on?'SOUND ON':'SOUND OFF'; if(AU.m) AU.m.gain.value=AU.on?0.35:0; if(!AU.on){ sirenSet(0,0); if(VOICE.ok) speechSynthesis.cancel(); } else auInit(); }
muteBtn.onclick=toggleMute;

/* ---------------- LEVEL ---------------- */
function levelDef(){
  const L=[];

function build(fromX){
  plats=[];coins=[];rolls=[];items=[];enemies=[];npcs=[];trigs=[];pops=[];boss=null;luas=null;S.perched=true;
  xings=CROSSINGS.map(c=>({...c,phase:'red',t:2+Math.random()*2,cars:[],spawn:0.6,snd:0}));
  for(const d of levelDef()){
    if(d.t==='plat'){plats.push({...d});continue;}
    if(d.t==='queue'){ npcs.push({k:'queue',x:d.x,c:d.c,sayT:0}); plats.push({k:'head',x:d.x-7,w:14,h:0,y:GROUND-47,q:npcs[npcs.length-1]}); continue; }

function update(dt){

  if(!input.j && P.vy<-230) P.vy=-230;
  P.vy=Math.min(800,P.vy+GRAV*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(camX+12,Math.min(S.lock?camX+VW-12:END,P.x));

    }

    for(let i=x.cars.length-1;i>=0;i--){ const c=x.cars[i]; c.s+=dt/0.95; if(c.s>1.25){x.cars.splice(i,1);continue;}
      if(c.s>0.62&&c.s<0.9 && P.x>x.x+6 && P.x<x.x+x.w-6 && P.y>GROUND-34){ hurt(c.k==='bus'?'DUBLIN BUS!':'WAIT FOR THE GREEN MAN!',P.x+30); P.x=x.x-6; } }
  }
  if(luas){
    if(!luas.fired && P.x>=luas.x){luas.fired=true; luas.warn=1.9; banner('DING DING! LUAS!'); sfx.ding();}
    if(luas.warn>0){ luas.warn-=dt; if(luas.warn<=0) luas.tram={x:camX+VW+10,w:250}; }
    if(luas.tram){ luas.tram.x-=400*dt; const tb={l:luas.tram.x,r:luas.tram.x+luas.tram.w,t:GROUND-60,b:GROUND};
      if(ov_(pb,tb) && pb.b>tb.t+6) hurt('THE LUAS ALWAYS WINS',P.x+30);
      if(luas.tram.x+luas.tram.w<camX-20) luas.tram=null; }
  }

function updEnemy(e,dt,pb,fist){
  if(e.flash>0) e.flash-=dt;
  if(e.type==='gull'){
    e.f+=dt*12;
    if(e.state==='enter'){ e.x+=e.vx*dt; e.y+=Math.sin(time*5+e.f)*0.4; if(e.x-P.x<130 && e.x>camX+30){ e.state='dive'; const dx=P.x-e.x, dy=(P.y-26)-e.y, d=Math.hypot(dx,dy)||1; e.vx=dx/d*270; e.vy=dy/d*270; } if(e.x<camX-40) return true; }
    else if(e.state==='dive'){ e.x+=e.vx*dt; e.y+=e.vy*dt; if(e.y>=groundAt(e.x)-18){ e.state='rise'; e.vx=-190; e.vy=-150; } if(e.x<camX-50||e.y<-50) return true; }
    else if(e.state==='rise'||e.state==='flee'){ e.x+=e.vx*dt; e.y+=e.vy*dt; if(e.y<-40||e.x<camX-50) return true; }
    else if(e.state==='dead'){ e.vy+=GRAV*dt; e.y+=e.vy*dt; e.x+=40*dt; return e.y>VH+30; }
    if(e.state==='dead'||e.state==='flee') return false;
    const eb={l:e.x-11,r:e.x+11,t:e.y-7,b:e.y+7};
    if(fist && ov_(fist,eb)){ killGull(e); return false; }
    if(ov_(pb,eb)){
      if(stomped(eb)){ killGull(e); bounce(); }
      else if(P.inv<=0){ hurt('NICKED YER ROLL!',e.x); e.state='flee'; e.vx=-100; e.vy=-190; }
    }
    return false;
  }
  if(e.type==='scooter'){
    if(e.state==='ride'){ e.x+=e.vx*dt;
      const eb={l:e.x-10,r:e.x+10,t:e.y-48,b:e.y};
      const down=()=>{ e.state='ko'; e.t=0; e.vx=-80; S.scums++; pts(300); craic(1); pop(e.x,e.y-70,'+300 GOTCHA!','#ffd84a'); for(let k=0;k<3;k++) coins.push({x:e.x-20+k*20,y:GROUND-40-k*8}); if(e.link) e.link.state='brake'; };
      if(ov_(pb,eb)){ if(stomped(eb)){ bounce(); down(); } else hurt('SCOOTER!',e.x); }
      else if(fist && ov_(fist,eb)) down();
      return e.x<camX-80;
    }
    e.t+=dt; e.x+=e.vx*dt; e.vx*=Math.pow(0.1,dt); return e.t>3;
  }
  if(e.type==='garda'){
    if(e.state==='chase'||e.state==='leave'){ e.x+=e.vx*dt; }
    else if(e.state==='brake'){ e.vx*=Math.pow(0.05,dt); e.x+=e.vx*dt; if(Math.abs(e.vx)<15){ e.state='arrest'; e.vx=0; e.t=2.2; e.say='NICE ONE, BUD!'; e.sayT=2.2; speak(e.say,'garda',true); pts(200); craic(1); } }
    else if(e.state==='arrest'){ e.t-=dt; if(e.sayT>0)e.sayT-=dt; if(e.t<=0){ e.state='leave'; e.vx=-260; } }
    const eb={l:e.x-46,r:e.x+46,t:GROUND-42,b:GROUND};
    if(ov_(pb,eb)){ if(stomped(eb)){ bounce(); P.vy=-520; pop(e.x,GROUND-70,'MIND THE CAR!','#fff'); } else if(Math.abs(e.vx)>60) hurt('GARDA!',e.x); }
    return e.x+60<camX-60;
  }
  if(e.state==='ko'){ e.t+=dt; return e.t>1.8; }
  if(e.x>camX+VW+50 && e.state!=='escape') return false;
  const dx=P.x-e.x;
  e.t-=dt; if(e.sayT>0) e.sayT-=dt;
  if(e.type==='scum'){
    if(e.state==='idle'){ e.state='walk'; e.say=['Howya bud','Give us a euro','Nice runners','What are you lookin at?','Story bud?'][hash(e.x|0,3)%5]; e.sayT=2.2; speak(e.say,'scum',false); }
    if(e.state==='walk'){ e.face=Math.sign(dx)||-1; e.vx=e.face*55; if(Math.abs(dx)<72){e.state='wind';e.t=0.45;e.vx=0;} }
    else if(e.state==='wind'){ e.vx=0; if(e.t<=0){e.state='lunge';e.t=0.32;e.vx=e.face*250;} }
    else if(e.state==='lunge'){ if(e.t<=0){e.state='recover';e.t=0.7;} }
    else if(e.state==='recover'){ e.vx*=0.9; if(e.t<=0) e.state='walk'; }
    else if(e.state==='hit'){ e.vx*=Math.pow(0.02,dt); if(e.t<=0) e.state='walk'; }
    e.x+=e.vx*dt; if(overGap(e.x)) e.x-=e.vx*dt; e.y=groundAt(e.x);
  } else {
    if(e.state==='cut'){ if(Math.abs(dx)<200){ e.state='grab'; e.t=2.8; e.say=e.kind==='dub'?'Sure nobody owns these!':"Ah here, it's mine now"; e.sayT=2.4; speak(e.say,'thief',true); } }
    else if(e.state==='grab'){ if(e.t<=0){ e.state='escape'; e.vx=260; e.face=1; } }
    else if(e.state==='hit'){ e.vx*=Math.pow(0.02,dt); e.x+=e.vx*dt; if(e.t<=0){ e.state='grab'; e.t=1.3; } }
    else if(e.state==='escape'){ e.x+=e.vx*dt; if(e.x>camX+VW+40){ craic(e.kind==='dub'?-1:-2); pop(P.x,P.y-70,e.kind==='dub'?'ANOTHER DUBLIN BIKE GONE':'BIKE GONE. CLASSIC.','#ff6b6b'); return true; } }
  }
  const eb={l:e.x-9,r:e.x+9,t:e.y-45,b:e.y};
  if(fist && ov_(fist,eb) && e.lastPunch!==punchId){ e.lastPunch=punchId; hitWalker(e,1); return false; }
  if(ov_(pb,eb)){
    if(stomped(eb)){ hitWalker(e,2); bounce(); }
    else if(e.type==='scum' && e.state!=='hit') hurt('OI!',e.x);
    else if(e.type==='thief' && e.state==='escape') hurt('OUTTA ME WAY',e.x);
  }
  return false;
}

function updBoss(dt,pb,fist){
  const b=boss; b.f+=dt*9; b.t-=dt; if(b.inv>0) b.inv-=dt;
  const cx=ARENA+VW/2;
  if(b.state==='enter'){ b.y+=90*dt; if(b.y>=76){b.state='hover';b.t=1.6;} }
  else if(b.state==='hover'){ b.x+=((cx+Math.sin(time*1.4)*160)-b.x)*Math.min(1,dt*3); b.y=76+Math.sin(time*3)*8; if(b.t<=0){b.state='aim';b.t=0.55;b.tx=Math.max(ARENA+30,Math.min(ARENA+VW-30,P.x));b.ty=GROUND-20;} }
  else if(b.state==='aim'){ b.x+=Math.sin(time*60)*1.2; if(b.t<=0){ const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy)||1, sp=360+(3-b.hp)*50; b.vx=dx/d*sp; b.vy=dy/d*sp; b.state='dive'; tone(900,.3,'sawtooth',.12,-500); } }
  else if(b.state==='dive'){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>=GROUND-20){ b.y=GROUND-20; b.state='ground'; b.t=1.3-(3-b.hp)*0.25; shake=0.2; } }
  else if(b.state==='ground'){ if(b.t<=0) b.state='rise'; }
  else if(b.state==='rise'){ b.y-=170*dt; b.x+=(cx-b.x)*dt; if(b.y<=76){ b.state='hover'; b.t=1.2+Math.random(); } }
  else if(b.state==='dead'){ b.vy+=GRAV*dt; b.y+=b.vy*dt; b.x+=b.vx*dt; if(b.y>VH+90) boss=null; return; }
  const bb={l:b.x-30,r:b.x+30,t:b.y-17,b:b.y+17};
  const vul=b.state==='ground';
  if(b.inv<=0 && vul && fist && ov_(fist,bb)) return hitBoss();
  if(ov_(pb,bb)){
    if(stomped(bb) && b.inv<=0 && (vul||b.state==='rise')){ bounce(); return hitBoss(); }
    if(!vul && b.inv<=0 && b.state!=='rise') hurt('NICKED YER ROLL!',b.x);
  }
}
function hitBoss(){
  const b=boss; b.hp--; b.inv=0.8; shake=0.3; sfx.stomp();
  if(b.hp<=0){ b.state='dead'; b.vy=-300; b.vx=90; S.lock=false; S.bossBeaten=true; S.money+=10; craic(3); pts(1000); banner('BIG GULL BEATEN!'); pop(b.x,b.y-40,'+1000 +€10','#ffd84a');
    for(let i=0;i<3;i++) rolls.push({x:b.x-30+i*30,y:GROUND-50}); }

}

/* ---------------- DRAW HELPERS ---------------- */
function S_(w){ctx.lineWidth=w||2;ctx.strokeStyle=OUT;ctx.lineJoin='round';ctx.lineCap='round';}
function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);}
function rrPath(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rb(x,y,w,h,r,c,ns){ctx.beginPath();rrPath(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();if(!ns)ctx.stroke();}
function circ(x,y,r,c,ns){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(!ns)ctx.stroke();}
function ell(x,y,rx,ry,c,ns){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(!ns)ctx.stroke();}
function txt(t,x,y,c,align,size,outline){ctx.font=(size||8)+'px '+FONTF;ctx.textAlign=align||'center';ctx.textBaseline='top';if(outline){ctx.lineWidth=3;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(t,x,y);}ctx.fillStyle=c;ctx.fillText(t,x,y);S_();}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const cl=v=>Math.max(0,Math.min(255,v+a));return '#'+[cl(n>>16),cl((n>>8)&255),cl(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function lerpC(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const m=(s)=>Math.round(((pa>>s)&255)+((((pb>>s)&255)-((pa>>s)&255))*t));return `rgb(${m(16)},${m(8)},${m(0)})`;}
function tri(x1,y1,x2,y2,x3,y3,c){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.stroke();}

  circ(11.5,hy+1.8,2,o.skin);

  else { rb(-2+sw*2,-31+by,6,15,3,o.top); circ(1+sw*2,-15+by,3.4,o.skin); if(o.can) rb(-2+sw*2,-22+by,6,8,1.5,o.can); }

function drawTram(sx){ const y=GROUND-60, w=250; if(sx>VW||sx+w<0) return; S_();
  rb(sx,y,w,56,8,'#dfe2e8'); fr(sx+2,y+40,w-4,6,'#7a1d6b'); fr(sx+2,y+46,w-4,3,'#ffd84a');
  for(let k=16;k<w-16;k+=24) box(sx+k,y+8,18,20,'#2b3440'); rb(sx,y+4,14,40,6,'#ffd84a'); circ(sx+6,y+34,3,'#fff');
  ctx.save(); ctx.strokeStyle=OUT; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx+100,y); ctx.lineTo(sx+118,y-16); ctx.lineTo(sx+136,y); ctx.moveTo(sx+100,y-16); ctx.lineTo(sx+140,y-16); ctx.stroke(); ctx.restore();
  txt('LUAS',sx+w/2,y+30,'#7a1d6b','center',8); for(let k=0;k<w;k+=62) circ(sx+20+k,y+58,5,'#333'); }
function drawCar(x,c){
  const s=0.25+c.s*1.25, bottom=GROUND-70+c.s*104;
  ctx.save(); ctx.translate(x,bottom); ctx.scale(s,s); S_(2);
  if(c.k==='bus'){ rb(-36,-96,72,96,6,'#f5c518'); fr(-34,-40,68,12,'#1a4aa0'); box(-30,-90,60,22,'#2b3440'); box(-30,-62,60,18,'#2b3440'); box(-24,-100,48,10,'#111'); txt('46A',0,-99,'#ffb020','center',8); circ(-24,-16,5,'#fff6c0'); circ(24,-16,5,'#fff6c0'); box(-14,-12,28,7,'#f4f4f4'); }
  else { const col=c.k==='taxi'?'#f4f4f4':c.c; rb(-34,-38,68,30,8,col); ctx.beginPath(); ctx.moveTo(-24,-38); ctx.lineTo(-18,-54); ctx.lineTo(18,-54); ctx.lineTo(24,-38); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.stroke(); fr(-17,-51,34,12,'#9cc6dc'); ctx.strokeRect(-17,-51,34,12);
    if(c.k==='taxi'){ box(-10,-62,20,8,'#f5d020'); txt('TAXI',0,-61,'#111','center',5); } circ(-22,-26,5,'#fff6c0'); circ(22,-26,5,'#fff6c0'); box(-12,-22,24,8,'#333'); box(-10,-12,20,6,'#f4f4f4'); fr(-34,-8,12,8,'#111'); fr(22,-8,12,8,'#111'); }
  ctx.restore(); S_();
}
function drawBoss(){ const b=boss, sx=b.x-camX; if(b.inv>0&&Math.floor(time*20)%2) return;
  const f=(b.vx<0||(b.state==='hover'&&P.x<b.x))?-1:1;
  if(b.state!=='dead') ell(sx,GROUND-1,24,4,'rgba(0,0,0,.25)',true);
  if(b.state==='dead'){ ctx.save(); ctx.translate(sx,b.y); ctx.rotate(Math.PI); gull(0,0,1,0,2.6,true); ctx.restore(); return; }
  gull(sx,b.y,f,b.state==='ground'?0:b.f,2.6,true);
  S_(); ctx.save(); ctx.translate(sx+f*22,b.y-26); ctx.beginPath(); ctx.moveTo(-9,4); ctx.lineTo(-9,-6); ctx.lineTo(-4,-1); ctx.lineTo(0,-8); ctx.lineTo(4,-1); ctx.lineTo(9,-6); ctx.lineTo(9,4); ctx.closePath(); ctx.fillStyle='#ffd84a'; ctx.fill(); ctx.stroke(); ctx.restore();
  if(b.state==='ground'&&Math.floor(time*6)%2) txt('STOMP IT!',sx,b.y-60,'#ffd84a','center',8,OUT);
  S_(); for(let i=0;i<3;i++) rb(VW/2-30+i*22,30,16,6,2,i<b.hp?'#e8423a':'rgba(255,255,255,.3)');
}
function bubble(x,y,t){ ctx.font='8px '+FONTF; const w=ctx.measureText(t).width+12; let bx=Math.round(x-w/2); bx=Math.max(4,Math.min(VW-w-4,bx)); S_(); rb(bx,y,w,16,5,'#fff'); tri(x-4,y+15,x+4,y+15,x,y+21,'#fff'); fr(x-3,y+13,6,3,'#fff'); txt(t,bx+w/2,y+4,'#1a1020','center',8); }
function drawPlayer(){
  if(P.inv>0 && Math.floor(time*14)%2) return;
  const sx=Math.round(P.x-camX), sy=Math.round(P.y);
  ell(sx,sy,10,2.5,'rgba(0,0,0,.25)',true);
  const o={f:P.face,skin:'#e8b58e',hair:'#2a1a10',hs:'short',top:'#1fa35a',legs:'#2d4a8c',shoes:'#f5f5f5',zip:true,punch:P.punchT>0,ph:P.anim*12,happy:true};
  if(P.bike){ bike(sx,sy,P.bikeKind==='dub'?'#5ab0e0':'#1f5fbf',P.anim); o.pose='ride'; o.ph=P.anim*14; if(!o.punch) o.armFwd=true; human(sx-2,sy-14,o); }
  else { o.pose=!P.onG?'jump':(P.vx?'walk':'stand'); human(sx,sy,o); }
}
function drawHUD(){
  S_(); rb(4,4,VW-8,20,6,'rgba(12,8,34,.82)');
  for(let i=0;i<5;i++){ if(i<S.rolls) drawRoll(20+i*24,14,0.85); else fr(11+i*24,11,18,6,'rgba(255,255,255,.15)'); }
  txt('€'+S.money,136,10,'#ffd84a','left',8);
  const kx=190; circ(kx+3,11,3,'#3fcf6a',true); circ(kx,15,3,'#3fcf6a',true); circ(kx+6,15,3,'#3fcf6a',true); fr(kx+2.5,16,1.5,5,'#3fcf6a');
  txt(String(S.craic),kx+12,10,'#3fcf6a','left',8);
  if(S.cans){ for(let k=0;k<4;k++) rb(222+k*6,8,5,10,1.5,'#d8d8e0'); }
  txt(String(S.score).padStart(6,'0'),300,10,'#fff','center',8);
  const px=350, pw=110, pp=Math.min(pw,P.x/goalX*pw); fr(px,12,pw,4,'rgba(255,255,255,.2)'); fr(px,12,Math.max(3,pp),4,'#3fcf6a'); circ(px+pp,14,3.5,'#1fa35a'); fr(px+pw-2,8,3,12,'#ffd84a');
  if(bannerT>0){ ctx.globalAlpha=Math.min(1,bannerT*2); S_(); rb(VW/2-120,44,240,24,8,'rgba(12,8,34,.8)'); txt(bannerText,VW/2,52,'#fff','center',10); ctx.globalAlpha=1; }
}

/* ---------------- FRAME ---------------- */
function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  const ox=shake>0?(Math.random()-.5)*5:0;
  ctx.save(); ctx.translate(ox,0);
  const cam0=camX; camX=Math.round(camX);
  dusk=Math.min(1,Math.max(0,(P.x||0)/END));
  const g=ctx.createLinearGradient(0,0,0,GROUND), a=dusk<.5?dusk*2:(dusk-.5)*2;
  g.addColorStop(0,dusk<.5?lerpC('#9aa6b4','#8fb8dc',a):lerpC('#8fb8dc','#4a3a78',a)); g.addColorStop(1,dusk<.5?lerpC('#dfe3e8','#dbe8f2',a):lerpC('#dbe8f2','#ffb070',a));
  ctx.fillStyle=g; ctx.fillRect(-10,0,VW+20,VH);
  for(let i=0;i<7;i++){ const cx=((i*113 - camX*0.08 + time*5)%(VW+120)+VW+120)%(VW+120)-60, cy=20+(i*29)%60; ctx.fillStyle=`rgba(255,255,255,${0.75-dusk*0.4})`; ctx.beginPath(); ctx.ellipse(cx,cy,30,9,0,0,7); ctx.ellipse(cx+14,cy-6,18,9,0,0,7); ctx.ellipse(cx-14,cy-3,14,7,0,0,7); ctx.fill(); }
  const fo=camX*0.25; ctx.fillStyle=lerpC('#8a96a8','#6a4a7a',dusk);
  for(let i=Math.floor(fo/44)-1;i<Math.floor(fo/44)+13;i++){ const h=40+hash(i,1)%50, x=i*44-fo; ctx.fillRect(x,GROUND-60-h,45,h+60); if(hash(i,2)%5===0){ ctx.fillRect(x+20,GROUND-60-h-50,3,50); ctx.fillRect(x-10,GROUND-60-h-50,60,3); ctx.fillRect(x+44,GROUND-60-h-50,2,20); } }
  const pbx=900-camX*0.12; if(pbx>-40&&pbx<VW+40) for(const o of [0,22]){ for(let k=0;k<6;k++) fr(pbx+o,GROUND-190+k*22,8,22,k%2?'#f4f4f4':'#d8262e'); }
  drawBack();
  drawBridge();
  drawGround();
  for(const x of xings) for(const c of x.cars) if(c.s<0.7) drawCar(x.x-camX+x.w/2,c);
  for(const p of plats) drawPlat(p);
  for(const c of coins) drawCoin(c);
  for(const r of rolls){ const sx=r.x-camX; if(sx>-20&&sx<VW+20) drawRoll(sx,r.y+Math.sin(time*4+r.x)*2.5); }
  for(const it of items){ const sx=it.x-camX; if(sx>-30&&sx<VW+30) drawItem(it.k,sx,it.y); }
  for(const n of npcs) drawNPC(n);
  { const sx=goalX-camX; if(sx<VW+80){ S_(); box(sx-26,GROUND-18,56,5,'#7a4a24'); box(sx-24,GROUND-13,4,13,'#333'); box(sx+24,GROUND-13,4,13,'#333'); human(sx+6,GROUND,{f:-1,pose:'sit',skin:'#c68a5a',hair:'#1a1a1a',hs:'short',top:'#6ab8ea',band:'#1b2a5a',legs:'#2a2a40',shoes:'#fff',armUp:true,can:'#2e8b3f',happy:true}); rb(sx-16,GROUND-26,6,9,1.5,'#2e8b3f'); if(Math.floor(time*2)%2) bubble(sx,GROUND-92,'OVER HERE!'); } }
  for(const e of enemies) if(e.type!=='gull') drawEnemy(e);
  if(state!=='title') drawPlayer();
  if(luas&&luas.tram) drawTram(luas.tram.x-camX);
  for(const e of enemies) if(e.type==='gull') drawEnemy(e);
  if(boss) drawBoss();
  for(const x of xings) for(const c of x.cars) if(c.s>=0.7) drawCar(x.x-camX+x.w/2,c);
  if(luas&&luas.warn>0&&Math.floor(time*6)%2){ ctx.fillStyle='rgba(255,216,74,.14)'; ctx.fillRect(-10,0,VW+20,VH); }
  if(dusk>0.55){ ctx.fillStyle=`rgba(40,20,80,${(dusk-.55)*0.35})`; ctx.fillRect(-10,0,VW+20,VH); }
  for(const p of pops) txt(p.text,p.x-camX,p.y,p.color,'center',8,OUT);
  for(const n of npcs) if(n.sayT>0&&n.say) bubble(n.x-camX,GROUND-(n.k==='students'?120:n.k==='queue'?92:96),n.say);
  for(const e of enemies) if(e.sayT>0&&e.say&&e.state!=='ko'&&e.type!=='garda') bubble(e.x-camX,e.y-84,e.say);
  camX=cam0;
  ctx.restore();
  if(state!=='title') drawHUD();
}

/* ---------------- LOOP ---------------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0); last=ts; time+=dt;
  if(state==='play'&&!paused){ update(dt); try{ musTick(); }catch(e){} }
  try{ draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
resetRun();
let started=false;
function init(){ if(started)return; started=true; showTitle(); requestAnimationFrame(loop); }
if(document.fonts&&document.fonts.load){ document.fonts.load('8px '+FONTF).then(init,init); setTimeout(init,1800); } else init();
})();
</script>
<script>
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
